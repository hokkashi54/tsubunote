<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="つぶノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>つぶノート</title>
<style>
:root{--bg:#fff;--bgt:rgba(255,255,255,.85);--fg:#0f1419;--sub:#536471;--line:#eff3f4;--hover:rgba(0,0,0,.03);--input:#eff3f4;--accent:#1d9bf0;--aw:rgba(29,155,240,.1);--like:#f91880;--rt:#00ba7c;--fs:15px;--shade:rgba(91,112,131,.4)}
[data-theme=dim]{--bg:#15202b;--bgt:rgba(21,32,43,.85);--fg:#f7f9f9;--sub:#8b98a5;--line:#38444d;--hover:rgba(255,255,255,.03);--input:#273340;--shade:rgba(91,112,131,.4)}
[data-theme=dark]{--bg:#000;--bgt:rgba(0,0,0,.65);--fg:#e7e9ea;--sub:#71767b;--line:#2f3336;--hover:rgba(255,255,255,.03);--input:#202327;--shade:rgba(91,112,131,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
html{scrollbar-gutter:stable}
body{overscroll-behavior-x:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:var(--fs);line-height:1.45;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
.side,.rcol{display:none}
.main{width:100%;max-width:600px;min-height:100vh;min-height:100dvh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:var(--bgt);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.tbar{height:53px;display:flex;align-items:center;gap:20px;padding:0 16px}
.tbar .ttl{font-size:20px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .ttl small{display:block;font-size:13px;font-weight:400;color:var(--sub);line-height:1.2}
.tbar .brand{flex:1;display:flex;justify-content:center;color:var(--accent)}
.tbar .brand svg{width:28px;height:28px;fill:var(--accent);stroke:none}
.tright{display:flex;gap:4px;align-items:center}
.ibtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{background:var(--hover)}
.tabs{display:flex}
.tabs button{flex:1;height:53px;color:var(--sub);font-weight:500;position:relative;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--fg);font-weight:700}
.tabs button.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:56px;height:4px;border-radius:2px;background:var(--accent)}
.post{border-bottom:1px solid var(--line);padding:12px 16px;cursor:pointer;transition:background .15s}
.post:hover{background:var(--hover)}
.pctx{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:13px;font-weight:700;margin:-4px 0 4px 28px}
.pctx svg{width:16px;height:16px}
.prow{display:flex;gap:12px}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--input);display:block}
.av-def{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;user-select:none}
.pb{flex:1;min-width:0}
.ph{display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0}
.hd{color:var(--sub);overflow:hidden;text-overflow:ellipsis;flex-shrink:2;min-width:0}
.dot{color:var(--sub);flex:none}
.tm{color:var(--sub);flex:none}
.more{margin-left:auto;color:var(--sub);width:30px;height:30px;margin-top:-6px;margin-bottom:-6px}
.more:hover{color:var(--accent);background:var(--aw)}
.rto{color:var(--sub);font-size:.93em}
.pt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.pt:empty{display:none}
.media{display:grid;gap:2px;margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.media img{width:100%;height:100%;object-fit:cover;display:block;background:var(--input);min-height:0;cursor:zoom-in}
.media.n1 img{height:auto;max-height:520px;min-height:120px}
.media.n2,.media.n3,.media.n4{grid-template-columns:1fr 1fr;aspect-ratio:16/9}
.media.n3,.media.n4{grid-template-rows:1fr 1fr}
.media.n3 img:first-child{grid-row:span 2}
img.miss{opacity:.35}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0;text-align:left;width:100%;background:none}
.fcard:hover{background:var(--hover)}
.fcard .fi{width:40px;height:40px;border-radius:10px;background:var(--aw);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.fcard .ft{min-width:0;flex:1;line-height:1.3}
.fcard .ft b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.fcard .ft small{color:var(--sub);font-size:13px}
.fcard .fx{color:var(--sub);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.fplayer{width:100%;border-radius:14px;max-height:480px;background:#000;display:block;margin-top:2px}
audio.fplayer{background:none;height:44px}
.stabs{display:flex;border-bottom:1px solid var(--line)}
.flist{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.acts{display:flex;justify-content:space-between;margin-top:6px;max-width:440px;color:var(--sub)}
.act{display:flex;align-items:center;gap:0;font-size:13px;min-width:0;flex:1 1 0}
.act span:not(.ic){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act.bm,.act[data-act=share]{flex:0 0 auto}
.pd .act{flex:0 0 auto}
.act .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.act svg{width:18px;height:18px}
.act.rp:hover{color:var(--accent)}.act.rp:hover .ic{background:var(--aw)}
.act.rt:hover,.act.rt.on{color:var(--rt)}.act.rt:hover .ic{background:rgba(0,186,124,.1)}
.act.lk:hover,.act.lk.on{color:var(--like)}.act.lk:hover .ic{background:rgba(249,24,128,.1)}
.act.lk.on svg{fill:var(--like)}
.act.vw:hover{color:var(--accent)}.act.vw:hover .ic{background:var(--aw)}
.act.bm:hover,.act.bm.on{color:var(--accent)}.act.bm:hover .ic{background:var(--aw)}
.act.bm.on svg{fill:var(--accent)}
.thread-line{position:relative}
.post.anc{border-bottom:0;padding-bottom:0}
.post.anc .prow>div:first-child{display:flex;flex-direction:column;align-items:center}
.post.anc .prow>div:first-child::after{content:"";width:2px;flex:1;background:var(--line);margin-top:4px;min-height:12px}
.pd{padding:12px 16px 0;border-bottom:1px solid var(--line)}
.pd .ph{gap:12px}
.pd .who{min-width:0;flex:1;line-height:1.3}
.pd .who .nm,.pd .who .hd{display:block}
.pd .pt{font-size:1.15em;margin-top:12px;line-height:1.5}
.pd .meta{color:var(--sub);margin:16px 0;font-size:.95em}
.pd .meta b{color:var(--fg)}
.pd .stats{display:flex;flex-wrap:wrap;gap:4px 20px;padding:14px 0;border-top:1px solid var(--line);color:var(--sub)}
.pd .stats b{color:var(--fg)}
.pd .acts{max-width:none;justify-content:space-around;border-top:1px solid var(--line);padding:4px 0;margin:0}
.pd .act svg{width:22px;height:22px}
.rbox{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center;cursor:text}
.rbox .ph2{flex:1;color:var(--sub);font-size:1.1em}
.pill{background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:8px 18px;white-space:nowrap}
.pill:disabled{opacity:.5;cursor:default}
.pill.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.pill.danger{background:none;color:#f4212e;border:1px solid rgba(244,33,46,.4)}
.pill.sm{padding:6px 14px;font-size:14px}
.qbox{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav a{flex:1;display:flex;justify-content:center;padding:14px 0 12px;color:var(--fg)}
.bnav svg{width:26px;height:26px}
.bnav a.on svg{stroke-width:2.6}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;z-index:31;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.fab svg{width:26px;height:26px;stroke-width:2}
.empty{padding:48px 32px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--fg);font-size:1.6em;font-weight:800;margin-bottom:8px;line-height:1.2}
.sent{height:1px}
.syncb svg{width:22px;height:22px}
.syncb.ok{color:var(--sub)}
.syncb.syncing svg{animation:spin 1s linear infinite;color:var(--accent)}
.syncb.login,.syncb.error{color:#f4212e}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{display:flex;gap:10px;align-items:center;background:var(--aw);padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.banner span{flex:1}
/* profile */
.pbanner{aspect-ratio:3/1;background:var(--input);overflow:hidden}
.pbanner img{width:100%;height:100%;object-fit:cover;display:block}
.phead{padding:12px 16px 0;position:relative}
.phead .av{border:4px solid var(--bg);margin-top:-15%;width:min(134px,25vw)!important;height:min(134px,25vw)!important}
.phead .av-def{font-size:min(56px,10vw)!important}
.phead .edit{position:absolute;right:16px;top:12px}
.phead .nm{font-size:1.4em;font-weight:800;margin-top:8px;display:block}
.phead .bio{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.phead .jn{color:var(--sub);margin-top:12px;display:flex;align-items:center;gap:4px}
.phead .ff{margin:12px 0;display:flex;gap:20px;color:var(--sub)}
.phead .ff b{color:var(--fg)}
/* search */
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--input);border-radius:999px;padding:0 14px;height:40px;border:1px solid transparent}
.sbox:focus-within{border-color:var(--accent);background:var(--bg)}
.sbox input{flex:1;background:none;border:0;outline:0;min-width:0}
.sec-ttl{font-size:1.3em;font-weight:800;padding:12px 16px}
.trend{padding:12px 16px;display:block;color:var(--fg)}
.trend:hover{background:var(--hover)}
.trend small{color:var(--sub);display:block;font-size:13px}
.trend b{display:block}
/* calendar */
.cal{padding:8px 12px 12px;border-bottom:1px solid var(--line)}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px}
.cal-h b{font-size:1.2em}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{font-size:12px;color:var(--sub);padding:4px 0}
.cal-g .wd:first-child{color:#e0245e}.cal-g .wd:nth-child(7){color:#1d9bf0}
.cal-d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;position:relative}
.cal-d:hover{background:var(--hover)}
.cal-d.today{color:var(--accent);font-weight:800}
.cal-d.sel{background:var(--accent);color:#fff}
.cal-d i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:block}
.cal-d.sel i{background:#fff}
.cal-d i.b2{width:8px;height:8px}.cal-d i.b3{width:10px;height:10px}
.cal-d.out{visibility:hidden}
.cal-sum{color:var(--sub);font-size:13px;padding:0 4px}
/* media grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.mgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--input);cursor:pointer}
/* settings */
.set-sec{border-bottom:1px solid var(--line);padding:8px 0 16px}
.set-sec h3{font-size:1.25em;font-weight:800;margin:8px 16px 8px}
.set-row{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:48px}
.set-row .lb{flex:1;min-width:0}
.set-row .lb small{display:block;color:var(--sub);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{border-color:var(--accent);background:var(--aw);color:var(--accent);font-weight:700}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s;cursor:pointer}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.swatch{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.swatch svg{width:22px;height:22px;stroke-width:3}
.fld{display:block;border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:8px 16px;position:relative}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fld small{display:block;color:var(--sub);font-size:13px}
.fld:focus-within small{color:var(--accent)}
.fld input,.fld textarea{width:100%;border:0;outline:0;background:none;padding:2px 0;resize:vertical}
.note{color:var(--sub);font-size:13px;padding:0 16px;overflow-wrap:anywhere}
.note code{background:var(--input);padding:1px 6px;border-radius:4px;user-select:all;color:var(--fg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px}
.range{flex:1;accent-color:var(--accent)}
.preset{display:flex;gap:8px;align-items:center;padding:4px 16px}
.preset span{width:64px;font-size:14px}
.preset input{width:100%;flex:1;min-width:0;background:var(--input);border:0;border-radius:6px;padding:6px 8px;outline:0}
/* layers */
.layer{position:fixed;inset:0;z-index:100}
.backdrop{position:absolute;inset:0;background:var(--shade);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.drawer{position:absolute;left:0;top:0;bottom:0;width:min(300px,82vw);background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom));animation:slide .22s ease-out;box-shadow:0 0 24px rgba(0,0,0,.2)}
@keyframes slide{from{transform:translateX(-100%)}}
.layer.drag .drawer,.layer.drag .backdrop{animation:none}
.drawer .dtop{display:flex;justify-content:space-between;align-items:flex-start;padding:4px 16px}
.drawer .dme{padding:8px 16px 0}
.drawer .dme .nm{font-size:1.1em;display:block}
.drawer .ff{display:flex;gap:16px;color:var(--sub);font-size:14px;margin:10px 0}
.drawer .ff b{color:var(--fg)}
.dacc{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left}
.dacc:hover{background:var(--hover)}
.dacc .t{flex:1;min-width:0;line-height:1.25}
.dacc .t b,.dacc .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dacc .t span{color:var(--sub);font-size:14px}
.dacc .ck{color:var(--accent)}
.dsep{height:1px;background:var(--line);margin:8px 0}
.dnav a,.dnav button{display:flex;align-items:center;gap:20px;padding:14px 16px;font-size:1.25em;font-weight:700;color:var(--fg);width:100%}
.dnav a:hover,.dnav button:hover{background:var(--hover)}
.dnav svg{width:24px;height:24px}
.dsync{color:var(--sub);font-size:13px;padding:8px 16px}
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.sheet .sh{display:flex;align-items:center;gap:12px;height:53px;padding:0 12px;flex:none}
.sheet .sh .sp{flex:1}
.sheet .sbody{flex:1;overflow-y:auto;padding:0 16px}
.cmp{display:flex;gap:12px;padding-top:4px}
.cmp .left{flex:none;position:relative}
.cmp textarea{width:100%;border:0;outline:0;background:none;resize:none;font-size:1.25em;min-height:120px;padding:6px 0;line-height:1.4}
.cmp .rt-to{color:var(--sub);font-size:14px;padding-top:4px}
.cmp .rt-to a{color:var(--accent)}
.accpick{position:absolute;top:46px;left:0;background:var(--bg);border-radius:12px;box-shadow:0 0 15px rgba(101,119,134,.3),0 0 3px 1px rgba(101,119,134,.15);z-index:5;width:260px;max-height:320px;overflow:auto;padding:4px 0}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.thumbs.n1{grid-template-columns:1fr}
.thumb{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:var(--input)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:rgba(15,20,25,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.thumb button svg{width:16px;height:16px;stroke-width:2.4}
.ctool{display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);padding:8px 12px;flex:none;color:var(--accent)}
.ctool .sp{flex:1}
.ctool .ibtn:hover{background:var(--aw)}
.ring{width:26px;height:26px;margin-right:8px}
.ccount{font-size:13px;color:var(--sub);margin-right:8px}
.cpanel{border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0 12px}
.cpanel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cpanel label{flex:1 1 40%;font-size:13px;color:var(--sub)}
.cpanel label input{display:block;width:100%;margin-top:2px;background:var(--input);border:0;border-radius:8px;padding:8px;outline:0;color:var(--fg);font-size:15px}
.cpanel .ttl{font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.cpanel .chip{padding:5px 12px}
.dtin{background:var(--input);border:0;border-radius:8px;padding:8px;outline:0;color:var(--fg)}
.asheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:16px 16px 0 0;padding:8px 0 calc(12px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.asheet button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 20px;font-weight:700;text-align:left}
.asheet button:hover{background:var(--hover)}
.asheet button.danger{color:#f4212e}
.asheet button svg{width:20px;height:20px}
.asheet .cancel{justify-content:center;border:1px solid var(--line);border-radius:999px;margin:12px 16px 0;width:calc(100% - 32px)}
.modal{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.modal .mbody{flex:1;overflow-y:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.ebanner{aspect-ratio:3/1;background:var(--input);position:relative;overflow:hidden}
.ebanner img{width:100%;height:100%;object-fit:cover;display:block}
.camb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(15,20,25,.6);color:#fff;display:flex;align-items:center;justify-content:center}
.eav{position:relative;margin:-36px 0 0 16px;width:84px;height:84px}
.eav .av{width:84px!important;height:84px!important;border:4px solid var(--bg)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vb{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.viewer .vclose{top:calc(12px + env(safe-area-inset-top));left:12px}
.viewer .vsave{top:calc(12px + env(safe-area-inset-top));right:12px}
.viewer .vprev{left:12px;top:50%}
.viewer .vnext{right:12px;top:50%}
.viewer .vpost{bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:auto;padding:0 16px;border-radius:999px;font-size:14px}
.viewer .vcnt{position:absolute;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:8px;z-index:300;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.2);animation:fade .2s;max-width:90vw;text-align:center}
mark{background:rgba(255,212,0,.45);color:inherit;border-radius:2px}
@media (min-width:700px){
  .bnav,.fab{display:none}
  .main{border-left:1px solid var(--line);border-right:1px solid var(--line);padding-bottom:0}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;width:88px;align-items:flex-end;padding:4px 12px;gap:4px;flex:none}
  .side a,.side>button{display:flex;align-items:center;gap:20px;padding:12px;border-radius:999px;color:var(--fg);font-size:1.3em}
  .side a:hover,.side>button:hover{background:var(--hover)}
  .side a.on{font-weight:800}
  .side a.on svg{stroke-width:2.6}
  .side svg{width:28px;height:28px}
  .side .lbl{display:none}
  .side .brandl svg{fill:var(--accent);stroke:none;width:32px;height:32px}
  .side .sbtn{background:var(--accent);color:#fff;width:52px;height:52px;justify-content:center;padding:0;margin-top:8px}
  .side .sbtn:hover{background:var(--accent)!important;filter:brightness(.92)}
  .side .sacc{margin-top:auto;margin-bottom:12px}
  .qbox{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:text;align-items:center}
  .qbox .ph2{flex:1;color:var(--sub);font-size:1.25em}
  .layer .sheet,.layer .modal{inset:auto;top:5vh;left:50%;transform:translateX(-50%);width:600px;max-width:calc(100vw - 32px);max-height:90vh;border-radius:16px;overflow:hidden;padding:0}
  .layer .sheet{min-height:320px}
  .layer .modal{height:min(720px,90vh)}
  .asheet{left:50%;right:auto;bottom:auto;top:30%;transform:translateX(-50%);width:340px;border-radius:16px;padding:8px 0 12px;animation:fade .15s}
  .toast{bottom:32px}
}
@media (min-width:1080px){
  .side{width:260px;align-items:stretch}
  .side .lbl{display:inline}
  .side a,.side>button{align-self:flex-start;padding:12px 20px 12px 12px}
  .side .sbtn{width:100%!important;align-self:stretch!important;height:52px;font-size:1.1em;font-weight:700}
  .side .sbtn svg{display:none}
  .side .sacc{align-self:stretch!important;width:100%}
  .side .sacc .t{flex:1;min-width:0;text-align:left;line-height:1.25;font-size:15px}
  .side .sacc .t b,.side .sacc .t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .sacc .t span{color:var(--sub)}
  .rcol{display:block;width:350px;padding:8px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;flex:none;scrollbar-width:none}
  .rcol::-webkit-scrollbar{display:none}
  .rcard{background:var(--input);border-radius:16px;margin-top:16px;overflow:hidden}
  [data-theme=light] .rcard{background:#f7f9f9}
  .rcard .sec-ttl{padding:12px 16px}
}
@media (max-width:1079px){.side .sacc .t{display:none}}

<body>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
  <aside class="rcol" id="rcol"></aside>
</div>
<nav class="bnav" id="bnav"></nav>
<button class="fab" id="fab" data-act="compose" aria-label="ポスト"></button>
<script>
'use strict';
/* ========== ユーティリティ ========== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>Date.now();
const randInt=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const ICONS={
 bubble:'<path d="M12 2.5c5.5 0 10 3.9 10 8.7s-4.5 8.7-10 8.7c-1.1 0-2.2-.2-3.2-.5L3.5 21.5l1.4-4.2C3.1 15.8 2 13.6 2 11.2 2 6.4 6.5 2.5 12 2.5z"/><circle cx="7.5" cy="11.2" r="1.3" fill="var(--bg)"/><circle cx="12" cy="11.2" r="1.3" fill="var(--bg)"/><circle cx="16.5" cy="11.2" r="1.3" fill="var(--bg)"/>',
 home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20"/>',
 set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 bookmark:'<path d="M6 3h12v18l-6-4.5L6 21z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/>',
 reply:'<path d="M4 5h16v11H10l-5 4v-4H4z"/>',
 rt:'<path d="m17 2 3 3-3 3"/><path d="M20 5H8a3 3 0 0 0-3 3v3"/><path d="m7 22-3-3 3-3"/><path d="M4 19h12a3 3 0 0 0 3-3v-3"/>',
 heart:'<path d="M12 20s-7.2-4.4-9.1-9.2C1.7 7.6 3.8 4 7.3 4c2 0 3.4 1.1 4.7 2.8C13.3 5.1 14.7 4 16.7 4c3.5 0 5.6 3.6 4.4 6.8C19.2 15.6 12 20 12 20z"/>',
 views:'<path d="M4 20v-8M9.3 20V5M14.6 20v-6M20 20V9"/>',
 share:'<path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/>',
 more:'<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
 back:'<path d="M20 12H4M10 18l-6-6 6-6"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.1 9.6 4.2 4.2 0 0 0 7 18z"/>',
 sync:'<path d="M20 11a8 8 0 0 0-14.3-4.7L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.7L20 16"/><path d="M20 21v-5h-5"/>',
 warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 pin:'<path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/>',
 left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>',
 check:'<path d="m5 12 5 5L20 7"/>',
 camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
 sortd:'<path d="M7 4v16M3 16l4 4 4-4M14 6h7M14 12h5M14 18h3"/>',
 sortu:'<path d="M7 20V4M3 8l4-4 4 4M14 6h3M14 12h5M14 18h7"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
 dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/>',
 clip:'<path d="M20.5 11.5 12.4 19.6a4.9 4.9 0 0 1-6.9-6.9l8.4-8.4a3.3 3.3 0 0 1 4.6 4.6l-8.3 8.3a1.6 1.6 0 0 1-2.3-2.3l7.6-7.6"/>',
 file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
 play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
 music:'<path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
 logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;
function fmtNum(n){n=+n||0;if(n<10000)return n.toLocaleString('ja-JP');if(n<1e8)return (Math.floor(n/1000)/10).toString().replace(/\.0$/,'')+'万';return (Math.floor(n/1e7)/10).toString().replace(/\.0$/,'')+'億'}
function relTime(t){const d=(now()-t)/1000;if(d>=0){if(d<60)return Math.floor(d)+'秒';if(d<3600)return Math.floor(d/60)+'分';if(d<86400)return Math.floor(d/3600)+'時間'}const x=new Date(t),n=new Date();return (x.getFullYear()===n.getFullYear()?'':x.getFullYear()+'年')+(x.getMonth()+1)+'月'+x.getDate()+'日'}
function fullTime(t){const d=new Date(t),h=d.getHours();return `${h<12?'午前':'午後'}${h%12||12}:${String(d.getMinutes()).padStart(2,'0')} · ${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function ymd(t){const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toLocalInput(t){const d=new Date(t);return new Date(t-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function hexA(h,a){h=h.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}
const AVC=['#1d9bf0','#7856ff','#f91880','#ff7a00','#00ba7c','#e0245e','#17a2b8','#794bc4'];
function hashColor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return AVC[Math.abs(h)%AVC.length]}
let toastT;function toast(m){$('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2400)}

/* ========== IndexedDB ========== */
const idb={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('tsubunote',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('blobs')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(st,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q instanceof IDBRequest?q.result:q);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 get(st,k){return this.tx(st,'readonly',s=>s.get(k))},
 put(st,k,v){return this.tx(st,'readwrite',s=>s.put(v,k))},
 del(st,k){return this.tx(st,'readwrite',s=>s.delete(k))},
 keys(st){return this.tx(st,'readonly',s=>s.getAllKeys())}
};

/* ========== データ ========== */
let D={accounts:{},posts:{},images:{}};
const SDEF={theme:'system',accent:'#1d9bf0',fontSize:15,sort:'desc',allAccounts:true,showReplies:false,current:null,clientId:'202179285341-dv8e1070737sjjp15hofbm6o2b1rihdd.apps.googleusercontent.com',linked:false,autoSync:true,lastSync:0,autoPreset:-1,presets:[[0,20],[20,400],[1000,30000]]};
let S={...SDEF,...JSON.parse(localStorage.getItem('tn_settings')||'{}')};
if(!S.clientId)S.clientId=SDEF.clientId;
const saveS=()=>localStorage.setItem('tn_settings',JSON.stringify(S));
let IDX=null;
function index(){if(IDX)return IDX;const ch={},tags={};for(const p of Object.values(D.posts)){if(p.deleted)continue;if(p.replyTo)(ch[p.replyTo]=ch[p.replyTo]||[]).push(p)}IDX={ch};return IDX}
const acc=id=>{const a=D.accounts[id];return a&&!a.deleted?a:null};
const liveAccs=()=>Object.values(D.accounts).filter(a=>!a.deleted).sort((a,b)=>(a.order??a.joined)-(b.order??b.joined));
const livePosts=()=>Object.values(D.posts).filter(p=>!p.deleted&&acc(p.accountId));
const repliesOf=id=>(index().ch[id]||[]).filter(p=>acc(p.accountId));
const cur=()=>acc(S.current)||liveAccs()[0];
const accByHandle=h=>liveAccs().find(a=>a.handle.toLowerCase()===h.toLowerCase());
const byTime=(a,b)=>S.sort==='asc'?a.createdAt-b.createdAt:b.createdAt-a.createdAt;
function save(){IDX=null;idb.put('kv','data',D);scheduleSync()}
function upsert(col,o){o.updatedAt=now();D[col][o.id]=o;save()}
function newAccount(o={}){const t=now();return{id:uid(),name:'ユーザー',handle:'user'+randInt(100,9999),bio:'',avatar:null,header:null,following:0,followers:0,joined:t,order:t,updatedAt:t,...o}}
function killImage(id){const im=D.images[id];if(im&&!im.deleted){im.deleted=true;im.updatedAt=now()}revokeImg(id)}
function ensureAccount(){if(!liveAccs().length){const a=newAccount({name:'わたし',handle:'me',auto:true});D.accounts[a.id]=a;idb.put('kv','data',D)}if(!acc(S.current)){S.current=liveAccs()[0].id;saveS()}}

/* ========== 画像 ========== */
const IMGURL=new Map();
async function imgURL(id){if(IMGURL.has(id))return IMGURL.get(id);let b=await idb.get('blobs',id);if(!b){const im=D.images[id];if(im&&im.driveId&&G.token()){try{b=await G.blob(im.driveId);await idb.put('blobs',id,b)}catch(e){}}}if(!b)return null;const u=URL.createObjectURL(b);IMGURL.set(id,u);return u}
function revokeImg(id){const u=IMGURL.get(id);if(u){URL.revokeObjectURL(u);IMGURL.delete(id)}}
function hydrate(root=document){for(const el of root.querySelectorAll('img[data-img]:not([src])')){el.src='data:image/gif;base64,R0lGODlhAQABAAAAACw=';imgURL(el.dataset.img).then(u=>{if(u)el.src=u;else el.classList.add('miss')})}}
function compress(file,max=1600,q=.85){return new Promise(res=>{if(file.type==='image/gif'&&file.size<8e6)return res(file);const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let w=im.naturalWidth,h=im.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',q)};im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
async function storeImage(file,max){const b=await compress(file,max);const id=uid();await idb.put('blobs',id,b);return{id,mime:b.type||'image/jpeg'}}
function registerImage(id,mime){D.images[id]={id,mime,driveId:null,updatedAt:now()}}
function pickFiles(multiple=true){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=multiple;i.onchange=()=>res([...i.files]);i.click()})}

/* ========== アバター・投稿HTML ========== */
function avatar(a,size=40){if(!a)return `<div class="av av-def" style="width:${size}px;height:${size}px"></div>`;if(a.avatar)return `<img class="av" data-img="${a.avatar}" style="width:${size}px;height:${size}px" alt="">`;return `<div class="av av-def" style="width:${size}px;height:${size}px;background:${hashColor(a.id)};font-size:${Math.round(size*.42)}px">${esc([...(a.name||'?')][0]||'?')}</div>`}
function linkify(t){let s=esc(t);s=s.replace(/https?:\/\/[^\s<>"']+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u.length>42?u.slice(0,42)+'…':u}</a>`);s=s.replace(/(^|[\s　(（、。])([#＃][\p{L}\p{N}_ー]+)/gu,(m,p,tag)=>`${p}<a href="#/search?q=${encodeURIComponent('#'+tag.slice(1))}">${tag}</a>`);s=s.replace(/(^|[\s　(（])@([A-Za-z0-9_]{1,30})/g,(m,p,h)=>{const a=accByHandle(h);return a?`${p}<a href="#/u/${a.id}">@${h}</a>`:m});return s}
function mediaHTML(p){const ims=(p.images||[]).filter(i=>D.images[i]&&!D.images[i].deleted).slice(0,4);if(!ims.length)return'';return `<div class="media n${ims.length}">${ims.map((i,k)=>`<img data-img="${i}" data-act="view" data-pid="${p.id}" data-k="${k}" alt="" loading="lazy">`).join('')}</div>`}
function fmtSize(n){n=+n||0;return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'}
function fileKind(m){m=m||'';return m.startsWith('video/')?'video':m.startsWith('audio/')?'audio':m==='application/pdf'?'pdf':m.startsWith('image/')?'image':'file'}
const liveFiles=p=>(p.files||[]).filter(i=>D.images[i]&&!D.images[i].deleted);
function fcardHTML(f,extra=''){const k=fileKind(f.mime);const ext=(f.name||'').split('.').pop().toUpperCase();return `<button class="fcard" data-act="file" data-id="${f.id}"${extra}><span class="fi">${ic(k==='video'?'play':k==='audio'?'music':k==='image'?'image':'file')}</span><span class="ft"><b>${esc(f.name||'ファイル')}</b><small>${fmtSize(f.size)}${ext&&ext.length<6?' · '+esc(ext):''}</small></span><span class="fx">${ic(k==='video'||k==='audio'?'play':'down')}</span></button>`}
function filesHTML(p){const fs=liveFiles(p);return fs.length?`<div class="files">${fs.map(i=>fcardHTML(D.images[i])).join('')}</div>`:''}
async function fileBlob(id){let b=await idb.get('blobs',id);if(b)return b;const f=D.images[id];if(!f||!f.driveId)return null;if(!G.token()){toast('Googleに接続すると開けます');return null}toast('ダウンロード中…');try{b=await G.blob(f.driveId);b=new Blob([b],{type:f.mime||b.type});await idb.put('blobs',id,b);return b}catch(e){toast('ファイルを取得できませんでした');return null}}
async function openFile(el){const id=el.dataset.id,f=D.images[id];if(!f)return;const k=fileKind(f.mime);
 const save=async()=>{const b=await fileBlob(id);if(b)download(f.name||'file',b)};
 const open=async()=>{const w=window.open('','_blank');const b=await fileBlob(id);if(!b){w?.close();return}const u=URL.createObjectURL(b);if(w)w.location=u;else location.href=u;setTimeout(()=>URL.revokeObjectURL(u),60000)};
 const play=async()=>{const b=await fileBlob(id);if(!b)return;const u=URL.createObjectURL(b);const m=document.createElement(k);m.className='fplayer';m.controls=true;m.src=u;m.setAttribute('playsinline','');m.dataset.fid=id;el.replaceWith(m);m.play?.().catch(()=>{})};
 actionSheet([...(k==='video'||k==='audio'?[{icon:'play',label:'再生',fn:play}]:[{icon:'file',label:'開く',fn:open}]),{icon:'down',label:'保存（ダウンロード）',fn:save}])}
function cnt(p,k){return (p.counts&&+p.counts[k])||0}
function actsHTML(p,big){const rc=cnt(p,'reply')+repliesOf(p.id).length;const n=v=>big?'':`<span>${v?fmtNum(v):''}</span>`;return `<div class="acts">
 <button class="act rp" data-act="reply" data-id="${p.id}" title="返信"><span class="ic">${ic('reply')}</span>${n(rc)}</button>
 <button class="act rt ${p.rted?'on':''}" data-act="rt" data-id="${p.id}" title="リポスト"><span class="ic">${ic('rt')}</span>${n(cnt(p,'rt'))}</button>
 <button class="act lk ${p.liked?'on':''}" data-act="like" data-id="${p.id}" title="いいね"><span class="ic">${ic('heart')}</span>${n(cnt(p,'like'))}</button>
 ${big?'':`<button class="act vw" title="表示数"><span class="ic">${ic('views')}</span>${n(cnt(p,'view'))}</button>`}

let LIST=null,IO=null;

function moreList(n=40){if(!LIST)return;const {items,el,o}=LIST;if(LIST.shown>=items.length)return;const sl=items.slice(LIST.shown,LIST.shown+n);el.insertAdjacentHTML('beforeend',sl.map(p=>postHTML(p,o)).join(''));LIST.shown+=sl.length;hydrate(el);let s=$('#sent');if(!s){s=document.createElement('div');s.id='sent';s.className='sent';el.after(s)}IO?.disconnect();IO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))moreList()},{rootMargin:'1200px'});IO.observe(s)}

 el.innerHTML=`<form class="sbox" data-form="search" style="margin-top:4px">${ic('search')}<input name="q" placeholder="メモを検索" value="${route().name==='search'?esc(route().q.get('q')||''):''}"></form>
 <div class="rcard"><div class="sec-ttl">あなたのトレンド</div>${tr.length?tr.map(([t,n],i)=>`<a class="trend" href="#/search?q=${encodeURIComponent(t)}"><small>${i+1} · トレンド</small><b>${esc(t)}</b><small>${n}件のポスト</small></a>`).join(''):'<div class="note" style="padding:0 16px 16px">#ハッシュタグ を付けてポストするとここに表示されます</div>'}</div>

 const tabs=[['posts','ポスト'],['replies','返信'],['media','メディア'],['likes','いいね']];

 <div class="jn">${ic('cal')} ${j.getFullYear()}年${j.getMonth()+1}月から利用しています</div>

function trends(){const m=new Map();for(const p of visPosts()){const seen=new Set();for(const t of (p.text||'').matchAll(/(?:^|[\s　(（、。])[#＃]([\p{L}\p{N}_ー]+)/gu)){const k='#'+t[1];if(seen.has(k))continue;seen.add(k);m.set(k,(m.get(k)||0)+1)}}return [...m].sort((a,b)=>b[1]-a[1])}
function vSearch(r){const q=r.q.get('q')||'';
 const head=`<div class="top"><div class="tbar">${q?`<button class="ibtn" data-act="back">${ic('back')}</button>`:''}<form class="sbox" data-form="search">${ic('search')}<input name="q" type="search" placeholder="メモを検索" value="${esc(q)}" enterkeyhint="search"></form></div></div>`;
 if(q)return head+'<div id="list"></div>';
 const tr=trends().slice(0,20);
 return head+`<div class="sec-ttl">あなたのトレンド</div>${tr.length?tr.map(([t,n],i)=>`<a class="trend" href="#/search?q=${encodeURIComponent(t)}"><small>${i+1} · トレンド</small><b>${esc(t)}</b><small>${n}件のポスト</small></a>`).join(''):'<div class="empty">#ハッシュタグ を付けてポストすると<br>ここにランキングが表示されます</div>'}`}
vSearch.after=r=>{const q=(r.q.get('q')||'').trim();if(!q){setTimeout(()=>{if(innerWidth>=700)$('.main .sbox input')?.focus()},50);return}
 let res;if(/^[#＃]/.test(q)){const tag=q.slice(1).toLowerCase();res=visPosts().filter(p=>[...(p.text||'').matchAll(/[#＃]([\p{L}\p{N}_ー]+)/gu)].some(m=>m[1].toLowerCase()===tag))}
 else{const ws=q.toLowerCase().split(/[\s　]+/);res=visPosts().filter(p=>{const a=acc(p.accountId);const h=((p.text||'')+' '+a.name+' @'+a.handle+' '+liveFiles(p).map(i=>D.images[i].name||'').join(' ')).toLowerCase();return ws.every(w=>h.includes(w))})}
 mountList(res.sort(byTime),{emptyT:`「${esc(q)}」の検索結果はありません`,emptyS:'別のキーワードで試してください。'})};

function vCal(r){const t=new Date();const y=+(r.q.get('y')||t.getFullYear()),mo=+(r.q.get('m')||t.getMonth()+1);const sel=r.q.get('d')||'';
 const counts={};for(const p of visPosts()){if(!S.allAccounts&&p.accountId!==cur().id)continue;const k=ymd(p.createdAt);counts[k]=(counts[k]||0)+1}
 const first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate();const pv=new Date(y,mo-2,1),nx=new Date(y,mo,1);let cells='',mon=0;
 for(let i=0;i<first.getDay();i++)cells+='<div class="cal-d out"></div>';
 for(let d=1;d<=days;d++){const k=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const n=counts[k]||0;mon+=n;cells+=`<button class="cal-d ${k===ymd(t)?'today':''} ${k===sel?'sel':''}" data-go="#/cal?y=${y}&m=${mo}&d=${k}">${d}${n?`<i class="${n>=5?'b3':n>=2?'b2':''}"></i>`:'<i style="visibility:hidden"></i>'}</button>`}
 return `<div class="top"><div class="tbar"><button class="ibtn" data-act="drawer" style="width:32px;height:32px">${avatar(cur(),32)}</button><div class="ttl">カレンダー</div></div></div>
 <div class="cal"><div class="cal-h"><button class="ibtn" data-go="#/cal?y=${pv.getFullYear()}&m=${pv.getMonth()+1}">${ic('left')}</button><b>${y}年${mo}月</b><button class="ibtn" data-go="#/cal?y=${nx.getFullYear()}&m=${nx.getMonth()+1}">${ic('right')}</button></div>
 <div class="cal-g">${'日月火水木金土'.split('').map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div><div class="cal-sum">${mo}月のポスト: ${mon}件${S.allAccounts?'':'（'+esc(cur().name)+'のみ）'}</div></div>
 ${sel?`<div class="sec-ttl" style="font-size:1.05em">${+sel.slice(5,7)}月${+sel.slice(8)}日のポスト</div>`:''}<div id="list"></div>`}
vCal.after=r=>{const sel=r.q.get('d');if(!sel)return;mountList(visPosts().filter(p=>ymd(p.createdAt)===sel&&(S.allAccounts||p.accountId===cur().id)).sort((a,b)=>a.createdAt-b.createdAt),{emptyT:'この日のポストはありません',emptyS:''})};

(()=>{let st=null;

  else if(t.clientX<=innerWidth*.4&&!$('.layer')&&!$('.viewer')&&!e.target.closest('input,textarea,.media'))st={mode:'open',x:t.clientX,y:t.clientY};
  if(st){st.lock=false;st.hist=[[t.clientX,performance.now()]]}},{passive:true});

   st.lock=true;if(st.mode==='open'){openDrawer()}st.P=drawerParts();if(!st.P){st=null;return}st.P.l.classList.add('drag')}
  e.preventDefault();const P=st.P,d=t.clientX-st.x;const x=st.mode==='open'?Math.min(0,Math.max(-P.w,d-P.w)):Math.min(0,Math.max(-P.w,d));
  st.cur=x;drawerPos(P,x,false);st.hist.push([t.clientX,performance.now()]);if(st.hist.length>5)st.hist.shift()},{passive:false});
 const end=()=>{if(!st||!st.lock){st=null;return}const P=st.P,h=st.hist,a=h[0],b=h[h.length-1];const v=(b[0]-a[0])/Math.max(1,b[1]-a[1]);const x=st.cur??(st.mode==='open'?-P.w:0);
  const open=v>0.35?true:v<-0.35?false:x>-P.w/2;

 if(kind==='txt'){download(`tsubunote_${stamp}.txt`,new Blob([ps.map(p=>{const a=acc(p.accountId);return `[${dt(p.createdAt)}] ${a.name} (@${a.handle})${p.replyTo?' ※返信':''}\n${p.text}\n`}).join('\n')],{type:'text/plain'}))}

/* ========== ツイメモCSVの取り込み ========== */
function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function strHash(s){let h1=0x811c9dc5,h2=0;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=(Math.imul(h2,31)+c)|0}return (h1>>>0).toString(36)+(h2>>>0).toString(36)}
async function importTwimemo(){const i=document.createElement('input');i.type='file';i.accept='.csv,text/csv,text/plain';i.onchange=async()=>{try{
 let t=await i.files[0].text();t=t.replace(/^\ufeff/,'');const rows=parseCSV(t);const h=rows.findIndex(r=>r[0]&&r[0].trim()==='作成日時');if(h<0)throw new Error('ツイメモのCSVではないようです');
 const col=n=>rows[h].findIndex(x=>x.trim()===n);const C={at:col('作成日時'),name:col('名前'),uid:col('ユーザid'),text:col('テキスト'),reply:col('コメント数'),rt:col('リメモ数'),like:col('いいね数')};
 const items=[];for(const r of rows.slice(h+1)){if(r.length<4)continue;const raw=(r[C.at]||'').trim();const at=Date.parse(raw.replace(' ','T'));if(!at)continue;
  const handle=(r[C.uid]||'').trim().replace(/^@/,'').replace(/[^A-Za-z0-9_]/g,'')||'user';const text=(r[C.text]||'').replace(/[ \t]+(?=\n|$)/g,'');const n=k=>C[k]>=0?Math.max(0,parseInt((r[C[k]]||'').trim())||0):0;
  items.push({at,handle,name:(r[C.name]||'').trim()||handle,text,reply:n('reply'),rt:n('rt'),like:n('like')})}
 if(!items.length)throw new Error('取り込めるメモがありませんでした');
 const accs=[...new Map(items.map(x=>[x.handle.toLowerCase(),x])).values()];
 const newAccs=accs.filter(x=>!accByHandle(x.handle));
 const dup=items.filter(x=>D.posts['tm_'+strHash(x.handle+'|'+x.at+'|'+x.text)]).length;
 if(!confirm(`ツイメモのメモ ${items.length}件を取り込みます。\n\nアカウント: ${accs.map(a=>a.name+' (@'+a.handle+')').join('、')}\n${newAccs.length?`（新しく作成: ${newAccs.length}件）`:''}${dup?`\n取り込み済みの ${dup}件 はスキップします。`:''}\n\n画像・返信のつながりはCSVに含まれないため移行されません。`))return;
 const t0=now();let k=0;
 for(const a of newAccs){const ac=newAccount({name:a.name,handle:a.handle,joined:Math.min(...items.filter(x=>x.handle===a.handle).map(x=>x.at)),order:t0+(k++)});ac.updatedAt=t0;D.accounts[ac.id]=ac}
 let added=0;for(const x of items){const id='tm_'+strHash(x.handle+'|'+x.at+'|'+x.text);if(D.posts[id])continue;const a=accByHandle(x.handle);D.posts[id]={id,accountId:a.id,text:x.text,images:[],createdAt:x.at,replyTo:null,counts:{reply:x.reply,rt:x.rt,like:x.like,view:0},liked:false,rted:false,bm:false,pinned:false,updatedAt:t0};added++}
 // 自動作成された未使用の初期アカウントは片付ける
 for(const a of Object.values(D.accounts))if(a.auto&&!a.deleted&&!Object.values(D.posts).some(p=>p.accountId===a.id&&!p.deleted)){a.deleted=true;a.updatedAt=t0}
 if(!acc(S.current)){S.current=accByHandle(accs[0].handle).id;saveS()}
 save();location.hash='#/home';render();toast(`${added}件を取り込みました`)}catch(e){toast(e.message||'読み込めませんでした')}};i.click()}

/* ========== Google ドライブ同期 ========== */
function redirectUri(){return location.origin+location.pathname.replace(/index\.html$/,'')}
const G={
 token(){try{const t=JSON.parse(localStorage.getItem('tn_gtoken')||'null');return t&&t.exp>now()+60000?t.v:null}catch(e){return null}},
 login(silent){if(!S.clientId){toast('設定でクライアントIDを入力してください');location.hash='#/settings';return}
  const st=uid();sessionStorage.setItem('tn_oauth_state',st);sessionStorage.setItem('tn_return',location.hash||'#/home');
  const p=new URLSearchParams({client_id:S.clientId,redirect_uri:redirectUri(),response_type:'token',scope:'https://www.googleapis.com/auth/drive.appdata',include_granted_scopes:'true',state:st});
  if(silent)p.set('prompt','none');localStorage.setItem('tn_lastauth',now());location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p},
 handleRedirect(){const h=location.hash;if(!/[#&](access_token|error)=/.test(h))return false;const q=new URLSearchParams(h.replace(/^#\/?/,''));const ret=sessionStorage.getItem('tn_return')||'#/home';
  if(q.get('state')!==sessionStorage.getItem('tn_oauth_state')){history.replaceState(null,'',redirectUri()+ret);return true}
  if(q.get('access_token')){localStorage.setItem('tn_gtoken',JSON.stringify({v:q.get('access_token'),exp:now()+(+q.get('expires_in')||3600)*1000}));if(!S.linked){S.linked=true;saveS();setTimeout(()=>toast('Googleドライブと接続しました'),300)}}
  else{this.authError=q.get('error');if(!['interaction_required','login_required','consent_required'].includes(this.authError))setTimeout(()=>toast('Google接続エラー: '+this.authError),300)}
  history.replaceState(null,'',redirectUri()+ret);return true},
 logout(){const t=this.token();if(t)fetch('https://oauth2.googleapis.com/revoke?token='+t,{method:'POST'}).catch(()=>{});localStorage.removeItem('tn_gtoken');S.linked=false;saveS();toast('切断しました')},
 async api(url,opt={}){const t=this.token();if(!t)throw new Error('auth');const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});if(r.status===401){localStorage.removeItem('tn_gtoken');throw new Error('auth')}if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200));return r},
 async list(){const q=encodeURIComponent("name='tsubunote-data.json'");return (await (await this.api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&pageSize=10`)).json()).files||[]},
 async blob(id){return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).blob()},
 async upload(meta,blob,id){const b='tnb'+uid();const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||'application/octet-stream'}\r\n\r\n`,blob,`\r\n--${b}--`]);
  const url=id?`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart&fields=id`:`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id`;
  return (await this.api(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json()},
 async uploadBig(meta,blob){const t=this.token();if(!t)throw new Error('auth');const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Type':blob.type||'application/octet-stream','X-Upload-Content-Length':String(blob.size)},body:JSON.stringify(meta)});if(r.status===401){localStorage.removeItem('tn_gtoken');throw new Error('auth')}if(!r.ok)throw new Error('HTTP '+r.status);const loc=r.headers.get('Location');if(!loc)throw new Error('upload location missing');const u=await fetch(loc,{method:'PUT',headers:{'Content-Type':blob.type||'application/octet-stream'},body:blob});if(!u.ok)throw new Error('HTTP '+u.status);return u.json()},
 async remove(id){try{await this.api(`https://www.googleapis.com/drive/v3/files/${id}`,{method:'DELETE'})}catch(e){if(!/HTTP 404/.test(e.message))throw e}}
};
let SYNC={busy:false,pending:false,err:null,timer:null};
function syncState(){if(!S.linked)return'off';if(SYNC.busy&&SYNC.manual)return'syncing';if(!G.token())return'login';if(SYNC.err)return'error';return'ok'}
function syncText(){const st=syncState();const last=S.lastSync?`最終同期: ${now()-S.lastSync<60000?'たった今':relTime(S.lastSync)+(now()-S.lastSync<86400000?'前':'')}`:'未同期';
 return {off:S.clientId?'未接続（設定から接続できます）':'未設定（設定でクライアントIDを入力）',syncing:'同期中…',login:'再接続が必要です · '+last,error:'エラー: '+esc(SYNC.err||'')+' · '+last,ok:'接続中 · '+last}[st]}
function updSyncUI(){$$('.syncb').forEach(b=>{const t=document.createElement('div');t.innerHTML=syncBtn();t.firstElementChild?b.replaceWith(t.firstElementChild):b.remove()});rcol()}
function scheduleSync(){if(!S.linked||!G.token())return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>sync(false),2500)}
function merge(a,b){const o={accounts:{},posts:{},images:{}};for(const c of ['accounts','posts','images']){o[c]={...(a[c]||{})};for(const [k,v] of Object.entries((b&&b[c])||{})){const x=o[c][k];if(!x||(v.updatedAt||0)>(x.updatedAt||0))o[c][k]=v}}return o}
async function sync(manual){if(!S.linked)return;if(SYNC.busy){SYNC.pending=true;return}if(!G.token()){updSyncUI();if(manual)G.login(false);return}
 SYNC.busy=true;SYNC.manual=!!manual;SYNC.err=null;updSyncUI();
 let changed=false;try{const files=await G.list();const f=files[0];
  if(f){const remote=await (await G.api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();const before=JSON.stringify(D);
   // 初回同期時: 自動作成された未使用アカウントは、リモートにアカウントがあれば削除
   const remoteAccs=Object.values(remote.accounts||{}).filter(x=>!x.deleted);
   for(const x of Object.values(D.accounts))if(x.auto&&!x.deleted&&remoteAccs.length&&!(remote.accounts||{})[x.id]&&!Object.values(D.posts).some(p=>p.accountId===x.id&&!p.deleted)){x.deleted=true;x.updatedAt=now()}
   D=merge(D,remote);IDX=null;if(JSON.stringify(D)!==before){changed=true;ensureAccount()}}
  const downloads=[];
  for(const im of Object.values(D.images)){
   if(im.deleted){if(im.driveId){await G.remove(im.driveId);im.driveId=null;im.updatedAt=now()}await idb.del('blobs',im.id);continue}
   const b=await idb.get('blobs',im.id);
   if(b&&!im.driveId){const r=await (b.size>4*1048576?G.uploadBig:G.upload).call(G,{name:(im.kind==='file'?'file_':'img_')+im.id,parents:['appDataFolder']},b);im.driveId=r.id;im.updatedAt=now()}
   else if(!b&&im.driveId&&im.kind!=='file')downloads.push(im)}
  const q=[...downloads];await Promise.all([0,1,2,3].map(async()=>{while(q.length){const im=q.shift();try{await idb.put('blobs',im.id,await G.blob(im.driveId))}catch(e){console.warn('画像取得失敗',im.id,e)}}}));
  await idb.put('kv','data',D);
  const body=new Blob([JSON.stringify(D)],{type:'application/json'});
  if(f)await G.upload({},body,f.id);else await G.upload({name:'tsubunote-data.json',parents:['appDataFolder']},body);
  for(const extra of files.slice(1))G.remove(extra.id).catch(()=>{});
  S.lastSync=now();saveS();if(manual)toast('同期しました');
  if((changed||downloads.length)&&!$('.layer'))softRender()}
 catch(e){console.error(e);if(e.message!=='auth')SYNC.err=e.message.slice(0,80);if(manual&&e.message!=='auth')toast('同期に失敗しました')}
 finally{SYNC.busy=false;SYNC.manual=false;updSyncUI();if(SYNC.pending){SYNC.pending=false;setTimeout(()=>sync(false),400)}}}
/* --- 有効期限の自動更新：操作していない安全なタイミングで裏で再接続 --- */
let lastInteract=0;['pointerdown','keydown','touchstart','wheel'].forEach(n=>addEventListener(n,()=>{lastInteract=now()},{passive:true,capture:true}));
function tokenLeft(){try{const t=JSON.parse(localStorage.getItem('tn_gtoken')||'null');return t?t.exp-now():-1}catch(e){return -1}}
function autoRefresh(force){if(!S.linked||!S.autoSync||!S.clientId||G.authError)return false;const left=tokenLeft();if(left>8*60000)return false;
 if(now()-(+localStorage.getItem('tn_lastauth')||0)<5*60000)return false;
 if($('.layer')||$('.viewer')||SYNC.busy||/INPUT|TEXTAREA/.test(document.activeElement?.tagName||''))return false;
 const hidden=document.visibilityState!=='visible';const idle=now()-lastInteract;
 if(!force&&!hidden&&idle<(left>0?30000:5000))return false;
 try{sessionStorage.setItem('tn_scroll',JSON.stringify({h:location.hash,y:scrollY,n:LIST?.shown||0}))}catch(e){}
 G.login(true);return true}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){autoRefresh(true);return}if(G.token())sync(false);else if(!autoRefresh(true))updSyncUI()});
setInterval(()=>{if(!autoRefresh(false)&&document.visibilityState==='visible'&&G.token()&&!SYNC.busy)sync(false)},30000);
setInterval(()=>{if(document.visibilityState==='visible'&&G.token()&&!SYNC.busy)sync(false)},5*60000);

/* ========== 起動 ========== */
(async()=>{applyTheme();await idb.open();const d=await idb.get('kv','data');if(d)D={accounts:{},posts:{},images:{},...d};
 const redirected=G.handleRedirect();curHash=location.hash;
 ensureAccount();render();navigator.storage?.persist?.();
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 try{const m=JSON.parse(sessionStorage.getItem('tn_scroll')||'null');sessionStorage.removeItem('tn_scroll');if(m&&(m.h||'#/home')===(location.hash||'#/home')){if(LIST&&m.n>LIST.shown)moreList(m.n-LIST.shown);scrollTo(0,m.y)}}catch(e){}
 if(G.token())sync(false);else if(!redirected)autoRefresh(true);
 })();
</script>
